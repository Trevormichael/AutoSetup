name: Package and release
on:
  push:
    tags:
      - "**"

# GitHub release only: no CurseForge, Wago or WoWInterface uploads.
permissions:
  contents: write

env:
  GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
        with:
          args: -S -p 0 -a 0 -w 0
